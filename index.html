<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runna: errand app prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#0f1512;--mute:#6a726d;--line:#e4e7e3;--accent:#0b6e4f;--accent-ink:#fff;--soft:#e6f1ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1311;--card:#171d1a;--ink:#eef2ef;--mute:#9aa49e;--line:#26302b;--accent:#2fbf8a;--accent-ink:#06150f;--soft:#14261f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1311;--card:#171d1a;--ink:#eef2ef;--mute:#9aa49e;--line:#26302b;--accent:#2fbf8a;--accent-ink:#06150f;--soft:#14261f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:20px 20px 110px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;text-transform:lowercase}
.logo span{color:var(--accent)}
.hero{padding:40px 0 32px}
.hero p{font-weight:800;font-size:38px;line-height:1.08;letter-spacing:-1.2px;margin:36px 0 0}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:50px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;width:100%}
.dark{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%}
.stack>*{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:6px 0 16px}
h2{font-size:16px;font-weight:700;margin:24px 0 10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:50px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{font-weight:700}
.meta{font-size:14px;color:var(--mute)}
.price{font-weight:800;font-size:17px;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);margin:8px 0 4px}
.pill.open{background:var(--soft);color:var(--accent)}
.pill.paid{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--mute);text-align:center;padding:24px 12px;border:1px dashed var(--line);border-radius:18px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bal{font-weight:800;font-size:38px;letter-spacing:-1.5px;line-height:1.1}
.steps{list-style:none;padding:0;margin:0}
.steps li{padding:8px 0 8px 32px;position:relative;color:var(--mute)}
.steps li:before{content:"";position:absolute;left:2px;top:11px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.steps li.done{color:var(--ink);font-weight:700}
.steps li.done:before{background:var(--accent);border-color:var(--accent)}
.escrow{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
.stars{display:flex;gap:6px}
.stars button{flex:1;padding:6px}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.link{background:none;border:none;color:var(--mute);width:auto;text-align:left;padding:0 0 8px;min-height:44px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;border:none;border-radius:0;background:none;padding:14px 4px;font-size:14px;color:var(--mute)}
nav button[aria-current="page"]{color:var(--accent);font-weight:800;box-shadow:inset 0 3px 0 var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;max-width:90%;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.note{font-size:13px;color:var(--mute);margin-top:16px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* sleek refresh */
:root{--bg:#fff;--card:#f4f6f4;--line:#e8ece8;--accent:#0a7d4d;--deep:#0b3d2c;--lime:#d4f26a}
body{letter-spacing:-.1px}
h1{font-size:30px;letter-spacing:-1px}
button{border-radius:99px}
input,select{background:var(--bg);border-radius:16px}
.card{border:none;border-radius:22px;padding:18px}
.empty{border-radius:22px}
.lime{background:var(--lime);color:#0b3d2c;border-color:var(--lime);font-weight:800;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.loc{background:var(--card);padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.loc:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--lime);color:#0b3d2c;display:grid;place-items:center;font-weight:800}
.heroc{background:var(--deep);color:#fff;border-radius:26px;padding:22px;margin:4px 0 8px}
.hh{font-weight:800;font-size:26px;line-height:1.12;letter-spacing:-.8px}
.hs{opacity:.8;font-size:14px;margin:10px 0 18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:92px;text-align:left;border-radius:22px;border:none;background:var(--card);padding:16px;font-weight:700;line-height:1.2;display:flex;align-items:flex-end}
nav{border-top:none;box-shadow:0 -8px 24px rgba(0,0,0,.06)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;font-size:12px;font-weight:600}
nav button[aria-current="page"]{box-shadow:none;color:var(--accent);font-weight:800}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.msg{background:var(--card);border-radius:18px 18px 18px 6px;padding:10px 14px;max-width:85%;align-self:flex-start}
.msg.me{background:var(--soft);border-radius:18px 18px 6px 18px;align-self:flex-end}
.msg img{display:block;max-width:100%;border-radius:12px;margin-bottom:6px}
.hero2{background:linear-gradient(135deg,#0b6e4f,#073d2c);color:#fff;border-radius:26px;padding:22px;margin:4px 0 18px;box-shadow:0 12px 30px rgba(7,61,44,.25)}
.hero2 h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.hero2 p{margin:6px 0 16px;opacity:.85;font-size:14px}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gl{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px}
.gl .t{font-size:12px;opacity:.9}
.gl .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.qa button{border:none;border-radius:20px;color:#fff;padding:16px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-weight:800;font-size:16px;line-height:1.2}
.qa small{font-weight:500;opacity:.85;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
var AREAS=["Kuto","Ijaye","Oke-Ilewo","Panseke","Lafenwa","Abiola Way","Others"];
var users={},U=null,S="welcome",tab="home",sel=null,role="C",pre="",ptype="Other",draft=null,tt;
var errands=[
{id:1,title:"Buy 2 loaves of bread and eggs",area:"Kuto",place:"Provision shop near Kuto roundabout",dropoff:"12 Adeola Street, Kuto",budget:2500,price:1500,status:"open",owner:"seed",cust:"Bukola"},
{id:2,title:"Pick up my laundry",area:"Oke-Ilewo",place:"Laundry shop on Oke-Ilewo road",dropoff:"5 Ayo Close, Oke-Ilewo",budget:3000,price:2000,status:"open",owner:"seed",cust:"Femi"},
{id:3,title:"Pay my DSTV at the shop",area:"Panseke",place:"DSTV shop, Panseke",budget:9000,price:1200,status:"open",owner:"seed",cust:"Ngozi"}
];
var nid=4,NAMES=["Tunde Adebayo","Amaka Obi","Chinedu Eze","Aisha Bello","Seun Ogunleye","Kemi Salami"];
var LABEL={open:"Waiting for an errander",taken:"Errander on the way",delivered:"Delivered, waiting for confirmation",paid:"Completed, payment released"};
var STEPS=["Posted","Accepted","Delivered","Paid"],IDX={open:0,taken:1,delivered:2,paid:3};

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function btn(text,fn,cls){var b=el("button",cls||"",text);b.addEventListener("click",fn);return b}
function naira(n){return "₦"+Number(n).toLocaleString("en-NG")}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2800)}
function val(id){return document.getElementById(id).value.trim()}
function field(label,id,type,ph,v){var d=el("div"),l=el("label","",label);l.setAttribute("for",id);var i=el("input");i.id=id;i.type=type||"text";if(ph)i.placeholder=ph;if(v!==undefined)i.value=v;d.appendChild(l);d.appendChild(i);return d}
function go(s,t){S=s;if(t)tab=t;render()}
function byId(id){return errands.find(function(x){return x.id===id})}
function mine(){return errands.filter(function(e){return U.role==="C"?e.owner===U.phone:e.byPhone===U.phone})}

/* ---------- auth ---------- */
function welcome(v){
 v.appendChild(el("span","pill open","Prototype: nothing here is real"));var h=el("div","hero");h.appendChild(el("div","logo")).innerHTML="";
 var lg=h.firstChild;lg.appendChild(document.createTextNode("Run"));lg.appendChild(el("span","","na"));
 h.appendChild(el("p","","Busy? Send someone. Free? Earn on the way."));
 v.appendChild(h);
 var s=el("div","stack");
 s.appendChild(btn("Create account",function(){go("signup")},"primary"));
 s.appendChild(btn("Log in",function(){go("login")},"dark"));
 v.appendChild(s);
 v.appendChild(el("p","note","Prototype for Abeokuta. Everything is simulated and resets when you reload."));
}
function signup(v){
 v.appendChild(btn("Back",function(){go("welcome")},"link"));
 v.appendChild(el("h1","","Create your account"));
 var q=el("div","meta","I want to");v.appendChild(q);
 var g=el("div","seg");g.style.margin="6px 0 6px";
 var bc=btn("Send errands",function(){role="C";bc.setAttribute("aria-pressed","true");be.setAttribute("aria-pressed","false")});
 var be=btn("Run errands",function(){role="E";be.setAttribute("aria-pressed","true");bc.setAttribute("aria-pressed","false")});
 bc.setAttribute("aria-pressed",String(role==="C"));be.setAttribute("aria-pressed",String(role==="E"));
 g.appendChild(bc);g.appendChild(be);v.appendChild(g);
 v.appendChild(field("Full name","s-n","text","e.g. Adaobi Okafor"));
 v.appendChild(field("Phone number","s-p","tel","08012345678"));
 v.appendChild(field("Password","s-w","password","At least 6 characters"));
 var b=btn("Create account",doSignup,"primary");b.style.marginTop="16px";v.appendChild(b);
}
function doSignup(){
 var n=val("s-n"),p=val("s-p"),w=document.getElementById("s-w").value;
 if(n.length<2)return toast("Enter your full name.");
 if(!/^0\d{10}$/.test(p))return toast("Enter an 11-digit phone number, like 08012345678.");
 if(w.length<6)return toast("Password needs at least 6 characters.");
 if(users[p])return toast("This number already has an account. Log in instead.");
 users[p]={name:n,phone:p,pw:w,role:role,balance:role==="C"?5000:0,verified:false,done:0,dep:0,float:0};
 U=users[p];tab="home";go("verify");
}
function login(v){
 v.appendChild(btn("Back",function(){go("welcome")},"link"));
 v.appendChild(el("h1","","Welcome back"));
 v.appendChild(field("Phone number","l-p","tel","08012345678"));
 v.appendChild(field("Password","l-w","password"));
 var b=btn("Log in",function(){
  var u=users[val("l-p")];
  if(!u||u.pw!==document.getElementById("l-w").value)return toast("Phone number or password is wrong.");
  U=u;tab="home";go(U.verified?"main":"verify");
 },"primary");b.style.marginTop="16px";v.appendChild(b);
 v.appendChild(el("p","note","No account yet? Go back and create one."));
}
function verify(v){
 v.appendChild(el("h1","","Verify your identity"));
 v.appendChild(el("p","meta",U.role==="E"?"Customers trust erranders with their money and sometimes their homes, so every errander is verified before accepting errands.":"Erranders go to the places you send them, so everyone who posts an errand is verified first. This keeps Runna from being used to lure anyone into harm."));
 v.appendChild(field("NIN (11 digits)","v-n","tel","12345678901"));
 var c=el("div","card","Selfie with your ID: the real app opens the camera here.");c.style.marginTop="12px";v.appendChild(c);
 v.appendChild(btn("Submit for verification",function(){
  if(!/^\d{11}$/.test(val("v-n")))return toast("NIN must be 11 digits.");
  U.verified=true;toast("Verified. In the real app this takes a few minutes of checks.");go("main");
 },"primary"));
}

/* ---------- main ---------- */
function card(e,label,fn){
 var c=el("div","card"),r=el("div","row"),l=el("div");
 l.appendChild(el("div","title",e.title));
 l.appendChild(el("div","meta",e.area+" · "+(e.cust?e.cust+" ✓ ID verified":U.name)+(e.by?" · errander: "+e.by:"")+(e.budget?" · items up to "+naira(e.budget):"")));
 r.appendChild(l);r.appendChild(el("div","price",naira(e.price)));
 c.appendChild(r);c.appendChild(el("span","pill "+e.status,LABEL[e.status]));
 var b=btn(label||"View details",fn||function(){sel=e.id;go("detail")});b.style.width="100%";b.style.marginTop="6px";c.appendChild(b);
 return c;
}
var PRE={"Buy items":"Buy: ","Pick up and drop off":"Pick up and deliver: ","Pay a bill":"Pay a bill: ","Other":""};
function qbtn(t,sub,g,fn){var b=el("button","",t);b.style.background="linear-gradient(135deg,"+g+")";b.appendChild(el("small","",sub));b.addEventListener("click",fn);return b}
function home(v){
 var m=mine(),first=U.name.split(" ")[0];
 var tb=el("div","top");tb.appendChild(el("div","loc","Abeokuta"));tb.appendChild(el("div","avatar",U.name.charAt(0).toUpperCase()));v.appendChild(tb);
 var h=el("div","hero2");
 h.appendChild(el("h2","","Welcome back, "+first));
 h.appendChild(el("p","",new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+". Here is your overview."));
 var st,gs=el("div","gs");
 if(U.role==="C"){
  var act=m.filter(function(e){return e.status!=="paid"}).length,held=0;
  m.forEach(function(e){if(e.status!=="paid")held+=(e.budget||0)+e.price});
  st=[["Active errands",act],["Completed",m.length-act],["Held by Runna",naira(held)],["Wallet",naira(U.balance)]];
 }else{
  var earn=0;m.forEach(function(e){if(e.status==="paid")earn+=e.price+(e.advance?0:(e.cost||0))});
  st=[["Open nearby",errands.filter(function(e){return e.status==="open"}).length],["Completed",U.done],["Earned",naira(earn)],["Advance limit",(U.done>=10&&U.dep>=5000)?"₦3,000":"Locked"]];
 }
 st.forEach(function(x){var g=el("div","gl");g.appendChild(el("div","t",x[0]));g.appendChild(el("div","v",String(x[1])));gs.appendChild(g)});
 h.appendChild(gs);v.appendChild(h);
 v.appendChild(el("h2","","Quick actions"));
 var qa=el("div","qa");
 if(U.role==="C"){
  [["Post an errand","Create a new errand","#0b6e4f,#0b8a5a","Other"],["Buy items","Shop for you","#ea580c,#f97316","Buy items"],["Pick up and drop off","Parcels and laundry","#7c3aed,#9333ea","Pick up and drop off"],["Pay a bill","DSTV, power and more","#0e7490,#0891b2","Pay a bill"]].forEach(function(q){
   qa.appendChild(qbtn(q[0],q[1],q[2],function(){pre=PRE[q[3]];ptype=q[3];draft=null;go("post")}));
  });
 }else{
  [["My jobs","Errands you accepted","#0b6e4f,#0b8a5a","jobs"],["Earnings","Balance and payouts","#ea580c,#f97316","wallet"],["Unlock advances","Deposit and rules","#7c3aed,#9333ea","wallet"],["Profile","Verified details","#0e7490,#0891b2","profile"]].forEach(function(q){
   qa.appendChild(qbtn(q[0],q[1],q[2],function(){tab=q[3];render()}));
  });
 }
 v.appendChild(qa);
 var need=m.filter(function(e){return U.role==="C"?e.status==="delivered":e.status==="taken"});
 if(need.length){v.appendChild(el("h2","","Needs your attention"));need.forEach(function(e){v.appendChild(card(e,"Review now"))})}
 if(U.role==="C"){
  v.appendChild(el("h2","","Your errands"));
  if(!m.length)v.appendChild(el("div","empty","No errands yet. Post your first one."));
  m.forEach(function(e){v.appendChild(card(e))});
 }else{
  v.appendChild(el("h2","","Open errands near you"));
  var o=errands.filter(function(e){return e.status==="open"});
  if(!o.length)v.appendChild(el("div","empty","No open errands right now. You will be notified when one comes in."));
  o.forEach(function(e){v.appendChild(card(e,"View and accept"))});
 }
}
function jobs(v){
 v.appendChild(el("h1","","My jobs"));
 var m=mine();
 if(!m.length)v.appendChild(el("div","empty","Accept an errand and it shows up here."));
 m.forEach(function(e){v.appendChild(card(e))});
}
function wallet(v){
 v.appendChild(el("h1","","Wallet"));
 var c=el("div","card");
 if(U.role==="C"){
  c.appendChild(el("div","meta","Available balance"));c.appendChild(el("div","bal",naira(U.balance)));
  var b=btn("Add ₦5,000 (simulated)",function(){U.balance+=5000;toast("₦5,000 added. The real app uses Paystack here.");render()},"primary");b.style.marginTop="12px";c.appendChild(b);
  v.appendChild(c);
  v.appendChild(el("h2","","Payments"));
  var m=mine();
  if(!m.length)v.appendChild(el("div","empty","Your payments show up here."));
  m.forEach(function(e){v.appendChild(card(e,"View details"))});
 }else{
  var paid=0,pend=0;mine().forEach(function(e){var r=e.price+(e.advance?0:(e.status==="paid"?e.cost||0:e.budget||0));if(e.status==="paid")paid+=r;else pend+=r});
  c.appendChild(el("div","meta","Earned"));c.appendChild(el("div","bal",naira(paid)));
  c.appendChild(el("div","meta","Pending: "+naira(pend)+" · Advance in hand: "+naira(U.float)));c.appendChild(el("div","meta","Deposit held by Runna: "+naira(U.dep)));
  var w=btn("Withdraw to bank (simulated)",function(){toast(paid?"Withdrawal started to your bank account in your verified name. New accounts wait 24 hours.":"Nothing to withdraw yet.")},"dark");w.style.marginTop="12px";c.appendChild(w);
  var dp=btn("Add ₦5,000 deposit (simulated)",function(){U.dep+=5000;toast("Deposit added. Refundable when you leave in good standing.");render()});dp.style.marginTop="8px";c.appendChild(dp);
  var ok=U.done>=10&&U.dep>=5000;
  var ad=el("div","escrow",ok?"Advances unlocked: Runna sends item money (up to ₦3,000) when you accept.":"Advances locked. Needs 10 completed errands (you have "+U.done+") and a ₦5,000 deposit. Until then, pay the shop first and get refunded.");ad.style.marginTop="12px";c.appendChild(ad);
  var sk=btn("Prototype: skip ahead to 10 completed errands",function(){U.done=10;toast("Skipped ahead for the demo.");render()});sk.style.marginTop="8px";c.appendChild(sk);
  v.appendChild(c);
 }
}
function profile(v){
 v.appendChild(el("h1","","Profile"));
 var c=el("div","card");
 c.appendChild(el("div","title",U.name));
 c.appendChild(el("div","meta",U.phone+" · "+(U.role==="C"?"Customer":"Errander")));
 c.appendChild(el("span","pill paid","Verified"));
 v.appendChild(c);
 v.appendChild(btn("Log out",function(){U=null;go("welcome")},"dark"));
}

/* ---------- post and detail ---------- */
var TYPES=["Buy items","Pick up and drop off","Queue for me","Pay a bill","Other"],DELIV=["Buy items","Pick up and drop off"];
function post(v){
 var dv=draft||{};
 v.appendChild(btn("Back",function(){draft=null;go("main","home")},"link"));
 v.appendChild(el("h1","","Post an errand"));
 var d0=el("div"),l0=el("label","","Type of errand");l0.setAttribute("for","p-k");d0.appendChild(l0);
 var k=el("select");k.id="p-k";TYPES.forEach(function(t){var o=el("option","",t);o.value=t;k.appendChild(o)});k.value=dv.k||ptype;d0.appendChild(k);v.appendChild(d0);
 v.appendChild(field("What do you need?","p-t","text","e.g. Buy pure water and bread",dv.t!==undefined?dv.t:pre));pre="";
 var d=el("div"),l=el("label","","Area (choose Others if it is not listed)");l.setAttribute("for","p-a");d.appendChild(l);
 var s=el("select");s.id="p-a";AREAS.forEach(function(a){var o=el("option","",a);o.value=a;s.appendChild(o)});if(dv.a)s.value=dv.a;d.appendChild(s);v.appendChild(d);
 v.appendChild(field("Exact place to go (shop, street, landmark)","p-x","text","Describe exactly where the errander should go",dv.x||""));
 var dd=field("Deliver to (full address and landmark)","p-d","text","Where should it be dropped off?",dv.d||"");v.appendChild(dd);
 function tog(){dd.style.display=DELIV.indexOf(k.value)>-1?"":"none"}k.addEventListener("change",tog);tog();
 v.appendChild(field("Item budget (₦): the most the errander may spend on items or bills","p-b","number","",dv.b!==undefined?dv.b:"2000"));
 v.appendChild(field("Errander fee (₦)","p-p","number","",dv.p||"1500"));
 v.appendChild(el("p","meta","You pay Runna the item budget plus the errander fee. Runna holds it and pays the errander only after you confirm delivery. Unspent budget comes back to your wallet. Balance: "+naira(U.balance)));
 v.appendChild(btn("Review errand",toConfirm,"primary"));
}
function toConfirm(){
 var k=val("p-k"),t=val("p-t"),a=val("p-a"),x=val("p-x"),dl=DELIV.indexOf(k)>-1,d=dl?val("p-d"):"",p=parseInt(val("p-p"),10),b=parseInt(val("p-b"),10);
 if(isNaN(b)||b<0)b=0;
 if(!t)return toast("Describe what you need first.");
 if(!x)return toast(a==="Others"?"Type the area and a full description of the place.":"Add the exact place, like the shop name or landmark.");
 if(dl&&!d)return toast("Add the delivery address.");
 if(!p||p<500)return toast("Errander fee must be at least ₦500.");
 if(b+p>U.balance)return toast("Not enough balance for "+naira(b+p)+". Add money in Wallet.");
 draft={k:k,t:t,a:a,x:x,d:d,p:p,b:b};go("confirm");
}
function confirmPost(v){
 var c=draft;
 v.appendChild(btn("Edit details",function(){go("post")},"link"));
 v.appendChild(el("h1","","Check your errand"));
 var cd=el("div","card");
 [["Type",c.k],["Task",c.t],["Area",c.a],["Go to",c.x],["Deliver to",c.d||"Not needed"],["Item budget",naira(c.b)],["Errander fee",naira(c.p)],["Total held by Runna",naira(c.b+c.p)]].forEach(function(r){var w=el("div");w.style.marginBottom="10px";w.appendChild(el("div","meta",r[0]));w.appendChild(el("div","title",r[1]));cd.appendChild(w)});
 v.appendChild(cd);
 v.appendChild(el("p","meta","Check the delivery address carefully. Runna holds the total and pays the errander only after you confirm delivery. Whatever the items cost below your budget comes back to your wallet."));
 v.appendChild(btn("Confirm and pay Runna",doPost,"primary"));
}
function doPost(){
 var c=draft;if(!c)return go("post");
 if(c.b+c.p>U.balance)return toast("Not enough balance. Add money in Wallet.");
 U.balance-=c.b+c.p;
 var e={id:nid++,title:c.t,type:c.k,area:c.a,place:c.x,dropoff:c.d,budget:c.b,price:c.p,status:"open",owner:U.phone};
 draft=null;errands.unshift(e);sel=e.id;toast("Paid to Runna and posted. Nearby erranders have been notified.");go("detail");
 setTimeout(function(){if(e.status==="open"){e.status="taken";e.by=NAMES[Math.floor(Math.random()*NAMES.length)];e.byPhone="sim";e.advance=e.budget>0&&e.budget<=3000;say(e,{from:"E",text:"Hi, I accepted your errand. I will send a photo and the price before I buy."});toast(e.by+" accepted your errand.");render();setTimeout(function(){if(e.budget&&e.status==="taken"){say(e,{from:"E",price:e.budget>=1000?e.budget-200:e.budget,approved:null});toast(e.by+" sent a price for approval.");render()}},2500)}},3500);
 setTimeout(function(){if(e.status==="taken"&&e.byPhone==="sim"){if(e.budget){e.cost=Math.max(0,e.budget-(e.budget>=1000?200:0));e.receipt=true}e.status="delivered";toast(e.by+" says it's delivered.");render()}},9000);
}
function acceptErrand(e){
 e.status="taken";e.by=U.name;e.byPhone=U.phone;
 var b=e.budget||0;
 if(b&&U.done>=10&&U.dep>=5000&&b<=3000){e.advance=true;U.float+=b;toast(naira(b)+" advance sent to your wallet. Use it to pay the shop.")}
 else if(b)toast("Pay the shop with your own money first. Runna refunds you after the customer confirms.");
 else toast("It's yours. Go get it.");
 render();
}
function deliverErrand(e){
 if(e.budget){
  if(e.advance&&!e.checked)return toast("Check in at the shop first.");
  var c=parseInt(document.getElementById("r-c").value,10);
  if(isNaN(c)||c<0)return toast("Enter what the items actually cost.");
  if(!proof(e))return toast("Send proof in the chat first: a photo (receipt, transfer or items) and a price the customer approves.");
  if(c>e.budget){
   toast("Items cost more than the budget. Asking the customer to approve "+naira(c-e.budget)+" more.");
   if(e.owner==="seed")setTimeout(function(){e.budget=c;toast(e.cust+" approved the higher budget. You can deliver now.");render()},2000);
   return;
  }
  e.cost=c;
 }
 e.status="delivered";toast("Marked delivered. Waiting for "+(e.cust||"the customer")+" to confirm.");render();
 if(e.owner==="seed")setTimeout(function(){settleSeed(e)},3000);
}
function settleSeed(e){
 e.status="paid";var b=e.budget||0,ch=b-(e.cost||0);
 if(e.advance)U.float-=b;
 U.done+=1;
 toast(e.cust+" confirmed. You earn "+naira(e.price)+(e.advance?"":" plus a "+naira(e.cost||0)+" refund")+"."+(ch>0?" Change of "+naira(ch)+" went back to the customer.":""));
 render();
}
function confirmDelivery(e){
 var ch=(e.budget||0)-(e.cost||0);e.status="paid";if(ch>0)U.balance+=ch;
 toast("Delivery confirmed. Runna paid "+e.by+(ch>0?" and returned "+naira(ch)+" to your wallet.":"."));render();
}
function proof(e){var ph=false,ok=false;(e.msgs||[]).forEach(function(x){if(x.from==="E"&&x.img)ph=true;if(x.price!==undefined&&x.approved)ok=true});return !!e.receipt||(ph&&ok)}
function say(e,m){(e.msgs=e.msgs||[]).push(m)}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.7))};i.onerror=function(){toast("Could not read that photo.")};i.src=r.result};r.readAsDataURL(file)}
function autoReply(e,kind){
 if(e.owner!=="seed"||U.role!=="E")return;
 setTimeout(function(){
  if(kind==="price"){var m=(e.msgs||[]).filter(function(x){return x.price!==undefined&&x.approved===null}).pop();if(m){m.approved=true;say(e,{from:"C",text:"Approved."})}}
  else say(e,{from:"C",text:"Got it, thanks."});
  render();
 },1800);
}
function chatScreen(v){
 var e=byId(sel);
 v.appendChild(btn("Back",function(){go("detail")},"link"));
 v.appendChild(el("h1","","Chat"));
 v.appendChild(el("p","meta",e.title+". Send photos of the items, a receipt or a transfer alert, and get the price approved before buying."));
 var box=el("div","chat"),ms=e.msgs||[];
 if(!ms.length)box.appendChild(el("div","empty","No messages yet."));
 ms.forEach(function(x){
  var b=el("div","msg"+(x.from===U.role?" me":""));
  if(x.img){var im=el("img");im.src=x.img;im.alt="Photo sent in chat";b.appendChild(im)}
  if(x.price!==undefined){
   b.appendChild(el("div","title","Price check: "+naira(x.price)));
   if(x.approved===true)b.appendChild(el("div","meta","Approved by the customer"));
   else if(x.approved===false)b.appendChild(el("div","meta","Declined"));
   else if(U.role==="C"){
    var a=btn("Approve",function(){x.approved=true;say(e,{from:"C",text:"Approved "+naira(x.price)+"."});render()},"primary");a.style.marginTop="8px";b.appendChild(a);
    var d=btn("Decline",function(){x.approved=false;say(e,{from:"C",text:"Declined. Please check the price."});render()});d.style.marginTop="6px";b.appendChild(d);
   }else b.appendChild(el("div","meta","Waiting for the customer to approve"));
  }
  if(x.text)b.appendChild(el("div","",x.text));
  box.appendChild(b);
 });
 v.appendChild(box);
 var row=el("div","stack");
 var f=el("input");f.type="file";f.accept="image/*";f.setAttribute("capture","environment");f.style.display="none";
 f.addEventListener("change",function(){var fl=f.files&&f.files[0];if(fl)shrink(fl,function(u){say(e,{from:U.role,img:u});autoReply(e,"photo");render()})});
 row.appendChild(f);
 row.appendChild(btn("Take photo",function(){f.click()}));
 if(U.role==="E"&&e.budget){
  row.appendChild(field("Price to approve (₦)","c-p","number","",""));
  row.appendChild(btn("Send price for approval",function(){var p=parseInt(val("c-p"),10);if(!p||p<=0)return toast("Enter the price first.");say(e,{from:"E",price:p,approved:null});e.costDraft=String(p);autoReply(e,"price");render()}));
 }
 row.appendChild(field("Message","c-t","text","Type a message",""));
 row.appendChild(btn("Send",function(){var t=val("c-t");if(!t)return;say(e,{from:U.role,text:t});render()},"primary"));
 v.appendChild(row);
}
function detail(v){
 var e=byId(sel);
 v.appendChild(btn("Back",function(){go("main")},"link"));
 var c=el("div","card"),r=el("div","row"),l=el("div");
 l.appendChild(el("div","title",e.title));l.appendChild(el("div","meta",e.area+" · "+(e.cust?e.cust+" ✓ ID verified":"You")));
 r.appendChild(l);r.appendChild(el("div","price",naira(e.price)));c.appendChild(r);
 if(e.place){var m1=el("div","meta","Go to: "+e.place);m1.style.marginTop="10px";c.appendChild(m1)}
 if(e.dropoff){var m2=el("div","meta","Deliver to: "+e.dropoff);m2.style.marginTop="4px";c.appendChild(m2)}
 if(e.budget){var m3=el("div","meta","Item budget: "+naira(e.budget)+" · Errander fee: "+naira(e.price));m3.style.marginTop="4px";c.appendChild(m3)}
 if(e.cost!==undefined){var m4=el("div","meta","Receipt: items cost "+naira(e.cost)+(e.budget-e.cost>0?" · change "+naira(e.budget-e.cost)+" returns to the customer":""));m4.style.marginTop="4px";c.appendChild(m4)}
 if(e.by&&e.budget){var m5=el("div","meta",e.advance?"Item money sent to the errander as an advance":"Errander pays the shop first and is refunded after confirmation");m5.style.marginTop="4px";c.appendChild(m5)}
 v.appendChild(c);
 var st=el("div","card"),ul=el("ul","steps");
 STEPS.forEach(function(s,i){ul.appendChild(el("li",i<=IDX[e.status]?"done":"",s))});
 st.appendChild(ul);v.appendChild(st);v.appendChild(el("div","escrow",e.status==="paid"?"Runna paid "+(e.by||"the errander")+(e.cost!==undefined&&e.budget-e.cost>0?". Change of "+naira(e.budget-e.cost)+" returned to the customer.":"."):"Runna is holding "+naira((e.budget||0)+e.price)+(e.budget?" ("+naira(e.budget)+" for items + "+naira(e.price)+" errander fee)":"")+" until delivery is confirmed"));
 var s=el("div","stack");
 if(U.role==="E"&&e.status==="open")s.appendChild(btn("Accept this errand",function(){
  acceptErrand(e);
 },"primary"));
 if(U.role==="E"&&e.status==="taken"&&e.byPhone===U.phone){
  if(e.budget){
   var sv=function(){var q=document.getElementById("r-c");if(q)e.costDraft=q.value};
   if(e.advance&&!e.checked)s.appendChild(btn("Check in at the shop (location)",function(){sv();e.checked=true;toast("Location check-in saved.");render()}));
   s.appendChild(field("Actual cost of items (₦)","r-c","number","",e.costDraft!==undefined?e.costDraft:e.budget));
   s.appendChild(btn(proof(e)?"Proof sent in chat":"Send photo and price in chat",function(){sv();go("chat")}));
  }
  s.appendChild(btn("I've delivered it",function(){deliverErrand(e)},"primary"));
 }
 if(U.role==="C"&&e.status==="delivered"){s.appendChild(el("div","meta","Only confirm once your errand has reached you. Runna then pays "+e.by+" the fee"+(e.cost?" and the item cost":"")+", and returns any change to your wallet."));s.appendChild(btn("Confirm delivery",function(){confirmDelivery(e)},"primary"))}
 if(e.by&&e.status!=="paid"){s.appendChild(btn("Chat with "+(U.role==="C"?e.by:(e.cust||"customer")),function(){go("chat")}));s.appendChild(btn("Report a problem or get help",function(){toast("In the real app this alerts the Runna safety team and shares live location.")}))}
 if(U.role==="C"&&e.status==="paid"){
  s.appendChild(el("div","meta","Rate "+e.by));
  var g=el("div","stars");
  for(var i=1;i<=5;i++)(function(n){var b=btn(n+"★",function(){e.rating=n;toast("Thanks for rating.");render()});b.setAttribute("aria-pressed",String(e.rating===n));g.appendChild(b)})(i);
  s.appendChild(g);
 }
 v.appendChild(s);
}

function nav(){
 var tabs=U.role==="C"?[["home","Home","M3 11l9-8 9 8v10H3zM9 21v-7h6v7"],["wallet","Wallet","M3 6h18v14H3zM3 10h18M16 15h2"],["profile","Profile","M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6"]]:[["home","Feed","M4 6h16M4 12h16M4 18h16"],["jobs","My jobs","M3 8h18v12H3zM9 8V5h6v3"],["wallet","Earnings","M3 6h18v14H3zM3 10h18M16 15h2"],["profile","Profile","M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6"]];
 var n=el("nav"),d=el("div");

function render(){
 var v=document.getElementById("app");v.textContent="";
 var old=document.querySelector("nav");if(old)old.remove();
